[project]
name = "zennit-crp"
version = "0.1.0"
description = "Concept Relevance Propagation and Relevance Maximization built on zennit"
readme = "README.md"
license = { text = "BSD-3-Clause-Clear" }
authors = [
    { name = "Samuel Wauthier", email = "samuel_wauthier@hotmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.60.0",
    "zennit>=1.0.0",
]

[project.scripts]
zennit-crp = "zennit_crp.__main__:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
